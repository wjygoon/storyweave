name: StoryWeave
teamId: 7H5P7CXTZZ
options:
  bundleIdPrefix: com.storyweave
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  objectVersion: 56
  projectFormat: "5.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""  # TODO: 替换为你的 Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Config/Info.plist
    ENABLE_PREVIEWS: YES
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
    SWIFT_OBJC_BRIDGING_HEADER: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_RESOURCE_RULES_PATH: ""
    ENABLE_TESTABILITY: NO
    GCC_LANGUAGE_STANDARD: gnu99
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    PRODUCT_BUNDLE_IDENTIFIER: com.barry.storyweave.app
    PRODUCT_NAME: "$(TARGET_NAME)"
    INSTALL_PATH: "$(LOCAL_APPS_DIR)"
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/Frameworks"
    CODE_SIGN_ENTITLEMENTS: StoryWeaveAI/Config/StoryWeave.entitlements

targets:
  StoryWeave:
    type: application
    platform: iOS
    sources:
      - path: StoryWeaveAI
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      - path: StoryWeaveAI/Config/Info.plist
      - path: StoryWeaveAI/Resources/Assets.xcassets
    resources:
      - StoryWeaveAI/Config/Secrets.plist
      - StoryWeaveAI/Resources/Assets.xcassets
    info:
      path: StoryWeaveAI/Config/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: "StoryWeave"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "APPL"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "StoryWeave 需要访问相册以保存故事分享卡片"
        NSCameraUsageDescription: "StoryWeave 需要访问相机以拍摄角色头像（可选）"
    entitlements:
      path: StoryWeaveAI/Config/StoryWeave.entitlements
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AuthenticationServices.framework
      - sdk: StoreKit.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Combine.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barry.storyweave.app
        DEVELOPMENT_ASSET_PATHS: ""
    preBuildScripts: []
    postBuildScripts: []

schemes:
  StoryWeave:
    build:
      targets:
        StoryWeave: all
    run:
      target: StoryWeave
    test:
      target: StoryWeave
    profile:
      target: StoryWeave
    analyze:
      target: StoryWeave
    archive:
      target: StoryWeave
